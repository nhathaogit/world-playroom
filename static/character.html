<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ nhân vật</title><link rel="icon" type="image/png" href="/static/logo.png"><link rel="shortcut icon" type="image/png" href="/static/logo.png"><link rel="apple-touch-icon" href="/static/logo.png">
<style>*{box-sizing:border-box}body{margin:0;background:#0d1119;color:#eee;font:16px/1.7 system-ui}main{max-width:1050px;margin:auto;padding:32px 24px}a{color:#d9b880}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.site-logo{width:32px;height:32px;object-fit:contain}.layout{display:grid;grid-template-columns:320px 1fr;gap:36px;margin-top:24px}img{width:100%;border-radius:20px}h1{font-size:38px;margin:0}h2{font-size:20px;color:#d9b880;margin-top:28px}p{white-space:pre-wrap;color:#bac3d1}textarea{width:100%;min-height:170px;padding:16px;background:#151c28;color:white;border:1px solid #596276;border-radius:12px;font:inherit}button{background:#d9b880;border:0;border-radius:10px;padding:14px 26px;font:inherit;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}.notice{font-size:13px}@media(max-width:700px){.layout{grid-template-columns:1fr}img{max-width:340px}}</style></head>
<body><main><div class="topbar"><a id="back" href="/boyfriend">← Về chợ</a><a href="/" title="Trang chủ"><img class="site-logo" src="/static/logo.png" alt="Logo Playroom"></a></div><div class="layout"><aside><img id="portrait" alt="Chân dung nhân vật"><p id="stats"></p><p class="notice" id="profile-notice">Player từ 18 tuổi · Lưu riêng trên máy này</p></aside><section><h1 id="name"></h1><p id="occupation"></p><div id="details"></div><h2>Persona của bạn</h2><p id="persona-hint">Tự điền tên, tuổi trưởng thành, tính cách, ngoại hình, xuất thân hoặc bất kỳ đặc điểm nào của vai bạn muốn chơi. Có thể để trống và bổ sung sau.</p><textarea id="persona" aria-label="Persona của Player" placeholder="Ví dụ: Tôi tên Minh, 25 tuổi, độc lập, thích nói đùa…"></textarea><br><button id="start" disabled>Bắt đầu trò chuyện</button><p id="status" role="status"></p></section></div></main>
<script>
const roomId=decodeURIComponent(location.pathname.split('/')[2]);
const headers={'X-Playroom-ID':roomId,'Content-Type':'application/json'};
function section(title,value){const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=Array.isArray(value)?value.join('\n'):value||'Chưa thiết lập';document.getElementById('details').append(h,p);}
async function load(){try{const responses=await Promise.all([fetch('/api/story',{headers}),fetch('/api/state',{headers}),fetch('/api/playrooms')]);if(responses.some(r=>!r.ok))throw Error('Không tải được hồ sơ');const [story,state,catalog]=await Promise.all(responses.map(r=>r.json()));const room=catalog.playrooms.find(r=>r.id===roomId);const profile=story.profile;const guidance=story.player_persona_guidance||{};if(guidance.hint)document.getElementById('persona-hint').textContent=guidance.hint;if(guidance.placeholder)document.getElementById('persona').placeholder=guidance.placeholder;document.getElementById('profile-notice').textContent=(story.rating||room.rating||'16+')+' · Player từ 18 tuổi · Lưu riêng trên máy này';document.getElementById('back').href='/'+room.category;document.getElementById('portrait').src=room.thumbnail;document.getElementById('name').textContent=profile.name;document.title=profile.name+' · Hồ sơ';document.getElementById('occupation').textContent=profile.occupation;const height=profile.height_cm==null?'Chiều cao: chưa thiết lập':profile.height_cm+' cm';const weight=profile.weight_kg==null?'Cân nặng: chưa thiết lập':profile.weight_kg+' kg';document.getElementById('stats').textContent=`${profile.age} tuổi · ${height} · ${weight}`;for(const [label,key] of [['Xuất thân','origin'],['Nơi ở','residence'],['Ngoại hình','appearance'],['Tính cách','personality'],['Thói quen','habits'],['Quan hệ ban đầu','relationship_with_player']])section(label,profile[key]);if(profile.secondary_gender)section('Phân hóa',profile.secondary_gender);if(profile.pheromone)section('Pheromone',profile.pheromone);section('Câu chuyện trước cuộc gặp',story.background_before_chat);section('Tình huống bắt đầu',story.starting_situation);document.getElementById('persona').value=state.player?.persona||'';document.getElementById('start').textContent=state.session_started?'Lưu persona & tiếp tục':'Bắt đầu trò chuyện';document.getElementById('start').disabled=false;}catch(e){document.getElementById('status').textContent=e.message;}}
document.getElementById('start').onclick=async()=>{const button=document.getElementById('start');button.disabled=true;try{const response=await fetch('/api/companion/start',{method:'POST',headers,body:JSON.stringify({persona:document.getElementById('persona').value})});if(!response.ok)throw Error('Chưa mở được cuộc trò chuyện');const data=await response.json();location.href=data.play_url;}catch(e){document.getElementById('status').textContent=e.message;button.disabled=false;}};load();
</script></body></html>
